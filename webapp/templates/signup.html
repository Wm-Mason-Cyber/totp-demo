{% extends "base.html" %}
{% block content %}
<h1>Create your account</h1>

<div class="card">
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" autocomplete="on">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username"
           autocapitalize="none" autocorrect="off" spellcheck="false" autofocus required>

    <label for="new-password">Password</label>
    <input id="new-password" name="new-password" type="password"
           autocomplete="new-password" required minlength="8">

    <label for="confirm-password">Confirm password</label>
    <input id="confirm-password" name="confirm-password" type="password"
           autocomplete="new-password" required minlength="8">

    <button type="submit">Sign up</button>
  </form>
  <p class="hint">Let Google Password Manager (or your favorite password
  manager) suggest a strong, unique password and save it for you.
  Already have an account? <a href="{{ url_for('login') }}">Log in</a>.</p>
</div>
{% endblock %}
