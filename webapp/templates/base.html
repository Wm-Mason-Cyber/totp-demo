<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TOTP 101{% if title %} - {{ title }}{% endif %}</title>
  <style>
    body {
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      max-width: 640px;
      margin: 40px auto;
      padding: 0 20px;
      color: #1a1a2e;
      background: #fafafa;
      line-height: 1.5;
    }
    h1 { font-size: 1.4rem; }
    .card {
      background: white;
      border: 1px solid #e2e2e2;
      border-radius: 10px;
      padding: 24px;
      margin: 16px 0;
    }
    code, .mono {
      font-family: "SF Mono", Consolas, monospace;
      background: #f0f0f5;
      padding: 2px 6px;
      border-radius: 4px;
      word-break: break-all;
    }
    input[type=text] {
      font-family: "SF Mono", Consolas, monospace;
      font-size: 1.3rem;
      letter-spacing: 0.2em;
      padding: 8px 12px;
      width: 160px;
    }
    button {
      font-size: 1rem;
      padding: 8px 18px;
      margin-left: 8px;
      cursor: pointer;
    }
    .error { color: #b00020; font-weight: 600; }
    .success { color: #1b7a3b; font-weight: 600; }
    .steps li { margin-bottom: 8px; }
    nav { margin-bottom: 24px; }
    nav a { margin-right: 16px; }
    img.qr { display: block; margin: 12px 0; border: 8px solid white; }
  </style>
</head>
<body>
  <nav>
    <a href="{{ url_for('index') }}">1. Enroll</a>
    <a href="{{ url_for('login') }}">2. Log in</a>
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
