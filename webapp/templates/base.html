<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if title %}{{ title }} - {% endif %}Mason Comet Cybersecurity</title>
  <style>
    body {
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      max-width: 640px;
      margin: 40px auto;
      padding: 0 20px;
      color: #1a1a2e;
      background: #fafafa;
      line-height: 1.5;
    }
    h1 { font-size: 1.4rem; }
    .card {
      background: white;
      border: 1px solid #e2e2e2;
      border-radius: 10px;
      padding: 24px;
      margin: 16px 0;
    }
    code, .mono {
      font-family: "SF Mono", Consolas, monospace;
      background: #f0f0f5;
      padding: 2px 6px;
      border-radius: 4px;
      word-break: break-all;
    }
    label { display: block; margin: 14px 0 4px; font-weight: 600; }
    input[type=text], input[type=password] {
      font-size: 1rem;
      padding: 8px 12px;
      width: 100%;
      max-width: 320px;
      box-sizing: border-box;
    }
    input.code-input {
      font-family: "SF Mono", Consolas, monospace;
      font-size: 1.3rem;
      letter-spacing: 0.2em;
      width: 180px;
    }
    button {
      font-size: 1rem;
      padding: 8px 18px;
      cursor: pointer;
    }
    form button[type=submit] { margin-top: 16px; }
    .hint { color: #555; font-size: 0.9rem; }
    .error { color: #b00020; font-weight: 600; }
    .success { color: #1b7a3b; font-weight: 600; }
    .warning {
      background: #fff8e1;
      border: 1px solid #f0d878;
      border-radius: 8px;
      padding: 12px 16px;
      margin: 12px 0;
    }
    .steps li { margin-bottom: 8px; }
    nav {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e2e2e2;
    }
    nav .brand { font-weight: 700; color: #1a1a2e; text-decoration: none; margin-right: auto; }
    nav .who { color: #555; font-size: 0.9rem; }
    img.qr { display: block; margin: 12px 0; border: 8px solid white; }
    .button {
      display: inline-block;
      background: #1a1a2e;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.9rem;
      margin-top: 8px;
    }
    .button:hover { background: #33334d; }
    .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .tab-btn {
      padding: 6px 14px;
      border: 1px solid #ccc;
      background: #f0f0f5;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
      font-family: inherit;
    }
    .tab-btn.active { background: #1a1a2e; color: white; border-color: #1a1a2e; }
  </style>
</head>
<body>
  <nav>
    <a class="brand" href="{{ url_for('index') }}">Mason Comet Cybersecurity</a>
    {% if session.get('user') %}
      <span class="who">{{ session['user'] }}</span>
      <a href="{{ url_for('logout') }}">Log out</a>
    {% else %}
      <a href="{{ url_for('login') }}">Log in</a>
      <a href="{{ url_for('signup') }}">Sign up</a>
    {% endif %}
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
